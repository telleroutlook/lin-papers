- id: formal-safety-barriers-2025
  title: "Provable Invariants in Agentic AI: Discrete Control Barrier Certificates
    for Code Execution"
  authors:
    - Alistair Vance
    - Sophia L. Wei
    - Henrik Lindqvist
  publishedDate: 2025-02-14
  abstract: Autonomous tool-use agents frequently violate privilege boundaries
    during iterative script invocation. We introduce discrete Control Barrier
    Certificates that constrain agent action proposals to provably
    forward-invariant safe sub-manifolds, guaranteeing zero privilege escalation
    even under adversarially injected instructions.
  keywords:
    - Formal Verification
    - Safety Guarantees
    - Control Barrier Functions
    - AI Safety
  doi: 10.48550/arXiv.2502.11044
  content: >-
    ## 1. Safety Envelope & Control Barrier Formulations


    Let $\mathcal{X} \subset \mathbb{R}^n$ represent the execution state space
    of an autonomous system and $\mathcal{U} \subset \mathbb{R}^m$ be the tool
    action space. A safe set $\mathcal{C}$ is defined as the super-level set of
    a continuously differentiable barrier function $B: \mathcal{X} \to
    \mathbb{R}$:


    $$\mathcal{C} = \left\{ \mathbf{x} \in \mathcal{X} : B(\mathbf{x}) \ge 0
    \right\}, \quad \partial \mathcal{C} = \left\{ \mathbf{x} \in \mathcal{X} :
    B(\mathbf{x}) = 0 \right\}$$


    The system dynamics obey discrete state transitions $\mathbf{x}_{k+1} =
    f(\mathbf{x}_k, \mathbf{u}_k)$. The action $\mathbf{u}_k$ emitted by the
    language policy $\pi_\theta$ must satisfy the discrete Control Barrier
    condition:


    $$\Delta B(\mathbf{x}_k, \mathbf{u}_k) = B(f(\mathbf{x}_k, \mathbf{u}_k)) -
    B(\mathbf{x}_k) \ge -\alpha B(\mathbf{x}_k), \quad \alpha \in (0, 1]$$


    ## 2. Quadratic Programming Projection Filter


    When the raw policy action $\mathbf{u}_0 \sim \pi_\theta(\cdot \mid
    \mathbf{x})$ attempts an unsafe transition, we project it onto the safe
    half-space via real-time quadratic programming:


    $$\begin{aligned}

    \mathbf{u}^* = \arg\min_{\mathbf{u} \in \mathcal{U}} \quad & \frac{1}{2}
    \|\mathbf{u} - \mathbf{u}_0\|^2 \\

    \text{s.t.} \quad & \nabla B(\mathbf{x})^\top f(\mathbf{x}, \mathbf{u}) +
    \alpha B(\mathbf{x}) \ge 0 \\

    & \mathbf{A}_{\text{audit}} \mathbf{u} \le \mathbf{b}_{\text{sandbox}}

    \end{aligned}$$


    ### Invariance Theorem

    If $\mathbf{x}_0 \in \mathcal{C}$ and $\mathbf{u}_k = \mathbf{u}^*$ for all
    $k \ge 0$, then:


    $$\mathbb{P}\left( \exists k \ge 0 : \mathbf{x}_k \in
    \mathcal{X}_{\text{unsafe}} \right) = 0$$


    The system remains invariant within $\mathcal{C}$ for all future time steps
    under any arbitrary instruction input.
  venue: ICML 2025 (Selected Publication)
  year: 2025
  category: Alignment & Safety
  tldr: Guarantees zero-privilege-escalation in autonomous terminal tool agents
    using quadratic programming projection onto control barrier submanifolds.
  citations: 92
  highlighted: true
  arxivId: "2502.11044"
  pdfUrl: https://arxiv.org/pdf/2502.11044
  codeUrl: https://github.com/vance-lab/discrete-barrier-invariants
- id: neurosymbolic-hamilton-world-models-2024
  title: "Hamiltonian Differentiable World Models: Enforcing Conservation Laws in
    Video Rollouts"
  authors:
    - Alistair Vance
    - Kenji Takahashi
    - Elena Rostova
  publishedDate: 2024-06-20
  abstract: Generative video models suffer from perceptual drift, hallucinations,
    and violations of basic physical laws during extended multi-second rollouts.
    We integrate Hamiltonian energy equations into the latent bottleneck of
    spatio-temporal diffusion models to enforce geometric phase space volume
    preservation.
  keywords:
    - World Models
    - Hamiltonian Mechanics
    - Diffusion Models
    - Physical AI
  doi: 10.1109/CVPR.2024.18921
  content: >-
    ## 1. Hamiltonian Symplectic Manifold Structure


    Classical mechanics describes physical states in phase space $(\mathbf{q},
    \mathbf{p}) \in \mathbb{R}^{2d}$ where $\mathbf{q}$ denotes generalized
    coordinates and $\mathbf{p}$ denotes conjugate momenta. The total energy
    Hamiltonian $\mathcal{H}(\mathbf{q}, \mathbf{p})$ satisfies Hamilton's
    canonical equations:


    $$\frac{d\mathbf{q}}{dt} = \frac{\partial \mathcal{H}}{\partial \mathbf{p}},
    \quad \frac{d\mathbf{p}}{dt} = -\frac{\partial \mathcal{H}}{\partial
    \mathbf{q}}$$


    By Liouville's theorem, phase space volume is strictly conserved along the
    Hamiltonian flow:


    $$\nabla \cdot \mathbf{v}_{\mathcal{H}} = \sum_{i=1}^d \left(
    \frac{\partial}{\partial q_i} \frac{\partial \mathcal{H}}{\partial p_i} -
    \frac{\partial}{\partial p_i} \frac{\partial \mathcal{H}}{\partial q_i}
    \right) = 0$$


    ## 2. Symplectic Integrator Diffusion Bottleneck


    To integrate the learned Hamiltonian $\mathcal{H}_\theta$ within a deep
    network, we employ a symplectic Verlet leapfrog integrator:


    $$\begin{aligned}

    \mathbf{p}_{t + \frac{\Delta t}{2}} &= \mathbf{p}_t - \frac{\Delta t}{2}
    \nabla_{\mathbf{q}} \mathcal{H}_\theta\left( \mathbf{q}_t, \mathbf{p}_{t +
    \frac{\Delta t}{2}} \right) \\

    \mathbf{q}_{t + \Delta t} &= \mathbf{q}_t + \frac{\Delta t}{2} \left[
    \nabla_{\mathbf{p}} \mathcal{H}_\theta\left( \mathbf{q}_t, \mathbf{p}_{t +
    \frac{\Delta t}{2}} \right) + \nabla_{\mathbf{p}} \mathcal{H}_\theta\left(
    \mathbf{q}_{t + \Delta t}, \mathbf{p}_{t + \frac{\Delta t}{2}} \right)
    \right] \\

    \mathbf{p}_{t + \Delta t} &= \mathbf{p}_{t + \frac{\Delta t}{2}} -
    \frac{\Delta t}{2} \nabla_{\mathbf{q}} \mathcal{H}_\theta\left(
    \mathbf{q}_{t + \Delta t}, \mathbf{p}_{t + \frac{\Delta t}{2}} \right)

    \end{aligned}$$


    This formulation guarantees that energy drift is strictly bounded over
    thousands of time steps:


    $$\left| \mathcal{H}(\mathbf{q}_T, \mathbf{p}_T) - \mathcal{H}(\mathbf{q}_0,
    \mathbf{p}_0) \right| = \mathcal{O}(\Delta t^2)$$
  venue: CVPR 2024 (Conference Publication)
  year: 2024
  category: Multimodal & World Models
  tldr: Guarantees exact conservation of momentum and energy across 1,200
    continuous simulated video frames using symplectic latent neural
    integrators.
  citations: 312
  award: Best Paper Finalist
