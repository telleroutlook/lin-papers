- id: "unique-paper-slug-2026"     # 唯一标识符（建议格式：作者-年份-关键词）
  title: "Your Paper Title Here"    # 论文标题
  topic: "Reasoning & Search"      # 主题分类（用于分类筛选标签，例如：Reasoning & Search, Inference & Systems, Alignment & Safety）
  doi: "10.48550/arXiv.2501.09871"  # DOI 编号或完整 DOI 链接（如: "https://doi.org/10.1000/182"）
  abstract: |                      # 论文摘要（支持标准多行 Markdown 语法、加粗、数学公式说明与分段列表）
    ### Background & Problem
    Autoregressive long-horizon exploration suffers from quadratic context growth.

    ### Methodology
    We formulate tree-of-thought exploration as gradient-guided latent trajectories.

    ### Key Findings
    Demonstrates a 4.2x compute reduction while achieving 93.4% accuracy on MATH-500.

